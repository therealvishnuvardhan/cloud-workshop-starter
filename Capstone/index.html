<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMAMIT Student Registry</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f5; color: #1a1a1a; margin: 0; }
  main { max-width: 760px; margin: 40px auto; padding: 0 20px; }
  h1 { margin: 0 0 4px; }
  .sub { color: #5a6670; margin: 0 0 28px; }
  form, table { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; margin-bottom: 24px; }
  label { display: flex; flex-direction: column; font-size: 13px; color: #5a6670; gap: 4px; }
  input { padding: 9px 10px; border: 1px solid #cfd6d3; border-radius: 6px; font-size: 15px; }
  button { grid-column: 1 / -1; padding: 11px; background: #1f4e5f; color: #fff; border: 0; border-radius: 6px; font-size: 15px; cursor: pointer; }
  #status { grid-column: 1 / -1; margin: 0; font-size: 14px; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #eef1ef; font-size: 14px; }
  th { background: #1f4e5f; color: #fff; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Student Registry</h1>
  <p class="sub">NMAMIT Cloud Workshop &middot; S3 + API Gateway + Lambda + DynamoDB</p>

  <form id="add">
    <label>USN <input name="id" required placeholder="4NM23AD010"></label>
    <label>Name <input name="name" required></label>
    <label>Age <input name="age" type="number" min="15" max="60" required></label>
    <label>Email <input name="email" type="email" required></label>
    <button type="submit">Register student</button>
    <p id="status"></p>
  </form>

  <table>
    <thead><tr><th>USN</th><th>Name</th><th>Age</th><th>Email</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4">Loading...</td></tr></tbody>
  </table>
</main>

<script>
  // Replace this with your own API address from Step C.6
  const API = "http://YOUR-API-ID.execute-api.localhost.localstack.cloud:4566";

  const rows = document.getElementById("rows");
  const statusLine = document.getElementById("status");

  async function load() {
    const res = await fetch(API + "/students");
    const students = await res.json();
    rows.innerHTML = students.map(s =>
      "<tr><td>" + s.id + "</td><td>" + s.name + "</td><td>" + s.age + "</td><td>" + s.email + "</td></tr>"
    ).join("") || "<tr><td colspan='4'>No students yet</td></tr>";
  }

  document.getElementById("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const res = await fetch(API + "/students", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    const out = await res.json();
    statusLine.textContent = res.ok ? "Registered " + out.id : "Error: " + out.error;
    if (res.ok) { e.target.reset(); load(); }
  });

  load().catch(err => { rows.innerHTML = "<tr><td colspan='4'>Could not reach the API: " + err + "</td></tr>"; });
</script>
</body>
</html>
